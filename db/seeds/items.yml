# Items seed data.
# Keys match the Item API response shape.
# category: one of headgear bodyArmor weapon shield amulet ring charm gauntlets boots
# quality:  one of rude normal rare legendary
# base_damage:  optional, weapon only (>= 0)
# base_defense: optional, armour/shield/etc (>= 0)
# enhancements: array of { type, value, element? } objects (empty array if none)
#   Enhancement types: damageBoost defenseBoost hpBoost mpBoost hpRegen mpRegen
#                      elementDamage elementResist goldLootBoost dropChanceBoost

